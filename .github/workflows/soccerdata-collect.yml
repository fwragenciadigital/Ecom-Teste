name: Coletar jogos BotBet

on:
  schedule:
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Data a consultar (AAAA-MM-DD). Deixe vazio para hoje."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python collector/monitor.py
        env:
          BOTBET_LEAGUES: CL,PPL,PL,DED,BL1,FL1,SA,PD,ELC,BSA,WC,EC
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          BOTBET_INGEST_URL: ${{ secrets.BOTBET_INGEST_URL }}
          BOTBET_INGEST_SECRET: ${{ secrets.BOTBET_INGEST_SECRET }}
          BOTBET_TARGET_DATE: ${{ inputs.target_date }}
