name: Coletar jogos BotBet

on:
  schedule:
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: collector/.cache
          key: soccerdata-${{ runner.os }}-${{ github.run_id }}
          restore-keys: soccerdata-${{ runner.os }}-
      - run: python -m pip install --upgrade pip && python -m pip install -r collector/requirements.txt
      - run: python collector/monitor.py
        env:
          SOCCERDATA_DIR: collector/.cache
          BOTBET_LEAGUES: ENG-Premier League,ESP-La Liga,ITA-Serie A,GER-Bundesliga,BRA-Serie A
          BOTBET_INGEST_URL: ${{ secrets.BOTBET_INGEST_URL }}
          BOTBET_INGEST_SECRET: ${{ secrets.BOTBET_INGEST_SECRET }}
