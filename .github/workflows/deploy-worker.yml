name: Deploy BotBet Worker

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - src/worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure KV namespace STATE
        run: |
          set -euo pipefail
          ID="$(npx wrangler kv namespace list | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')||'[]').find(n=>n.title==='STATE')?.id||''")"
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create STATE | tee /tmp/kv-create.txt
            ID="$(grep -oE '[a-f0-9]{32}' /tmp/kv-create.txt | tail -1)"
          fi
          echo "KV_STATE_ID=$ID"
          perl -pi -e "s/^id = \".*\"/id = \"$ID\"/" wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "138d2337c187637d995f5b2c0ba94033"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "138d2337c187637d995f5b2c0ba94033"
